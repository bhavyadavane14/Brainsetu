<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3B6E" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bridgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Left Hemisphere / Nodes -->
  <path d="M 28 14 C 20 14, 12 20, 12 30 C 12 36, 15 41, 19 44 C 18 48, 21 52, 26 52 C 27.5 52, 29 51.5, 30 50.5" 
        stroke="url(#brainBlue)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Left Inner Circuits -->
  <path d="M 18 28 C 22 28, 24 23, 27 23" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="18" cy="28" r="2" fill="#06B6D4" />
  <circle cx="27" cy="23" r="2" fill="#06B6D4" />
  
  <!-- Right Hemisphere / Nodes -->
  <path d="M 36 14 C 44 14, 52 20, 52 30 C 52 36, 49 41, 45 44 C 46 48, 43 52, 38 52 C 36.5 52, 35 51.5, 34 50.5" 
        stroke="url(#brainBlue)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        
  <!-- Right Inner Circuits -->
  <path d="M 46 28 C 42 28, 40 23, 37 23" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="28" r="2" fill="#06B6D4" />
  <circle cx="37" cy="23" r="2" fill="#06B6D4" />

  <!-- The Learning Bridge (Golden connecting arch) -->
  <path d="M 17 38 C 24 26, 40 26, 47 38" 
        stroke="url(#bridgeGold)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#glow)"/>
        
  <!-- Secondary Bridge Wire -->
  <path d="M 21 44 C 27 35, 37 35, 43 44" 
        stroke="url(#bridgeGold)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 3" fill="none"/>

  <!-- Bridge Central Spark / Keystone -->
  <circle cx="32" cy="30" r="3" fill="#F59E0B" filter="url(#glow)" />
  <circle cx="32" cy="30" r="1.5" fill="#FFFFFF" />
  
  <!-- Lower connection anchor / Setu foundation -->
  <path d="M 27 50 L 37 50" stroke="#0B2545" stroke-width="2.5" stroke-linecap="round" />
</svg>